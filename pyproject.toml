[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-framework"
version = "0.1.0"
description = "Reference implementation of the Cognitive Entropy Measurement Framework (MF-0.1)"
authors = [{ name = "Larry Arnold" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Arnoldlarry15/cognitive-entropy-framework"

[tool.setuptools.packages.find]
include = ["ec_framework*"]
